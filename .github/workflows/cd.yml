name: CD

# Merging to main builds what a release ships: ImplDmNote for macOS and
# Windows and the Windows in-game viewer library. `./scripts/run.sh release`,
# on the Mac with the game, downloads them, builds the mod around them and
# publishes the release (docs/releasing.md). Run it by hand on another branch
# (gh workflow run cd.yml --ref dev) to get test builds for windows-install.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Shared version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: The mod and ImplDmNote share one version
        run: node scripts/tasks/version/version.mjs check

  impl-dm-note:
    name: ImplDmNote (${{ matrix.os }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      LIBCLANG_PATH: C:\Program Files\LLVM\bin

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/impl-dm-note/src-tauri
          cache-on-failure: true

      - name: Install dependencies
        run: npm ci

      - name: Clean macOS release build
        if: runner.os == 'macOS'
        run: |
          rm -rf apps/impl-dm-note/src-tauri/target
          npm run desktop:build:mac
          APP=apps/impl-dm-note/src-tauri/target/release/bundle/macos/ImplDmNote.app
          test -d "$APP/Contents/Resources/ImplDmNote.app"
          for file in LICENSE UPSTREAM.md THIRD_PARTY_NOTICES.txt THIRD_PARTY_LICENSES.txt; do
            test -f "$APP/Contents/Resources/$file"
          done
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Contents/Info.plist")" = "io.github.kgh1113.impldmnote"
          codesign --verify --deep --strict "$APP"
          # ditto keeps the signature and executable modes upload-artifact would drop.
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/ImplDmNote.app.zip"

      - name: Upload macOS app
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: impl-dm-note-macos-app
          path: ${{ runner.temp }}/ImplDmNote.app.zip
          if-no-files-found: error

      - name: Build Windows portable ZIP
        if: runner.os == 'Windows'
        run: npm run desktop:build:windows

      - name: Verify Windows portable ZIP
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Get-Content apps/impl-dm-note/package.json | ConvertFrom-Json).version
          $name = "ImplDmNote-v$version-windows-x64-portable"
          $zip = "apps/impl-dm-note/dist/portable/$name.zip"
          if (-not (Test-Path $zip)) { throw "Missing $zip" }
          $unpack = Join-Path $env:RUNNER_TEMP "impl-dm-note-portable"
          Expand-Archive -Path $zip -DestinationPath $unpack -Force
          $root = Join-Path $unpack $name
          @(
            'impl-dm-note.exe',
            'LICENSE',
            'UPSTREAM.md',
            'THIRD_PARTY_NOTICES.txt',
            'THIRD_PARTY_LICENSES.txt'
          ) | ForEach-Object {
            if (-not (Test-Path (Join-Path $root $_))) { throw "Missing portable file: $_" }
          }
          if (Get-ChildItem $root -Recurse -File | Select-String -SimpleMatch 'com.dmnote.desktop','CN=esihunc') {
            throw 'Upstream package identity remains in the portable output.'
          }

      - name: Upload Windows portable ZIP
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: impl-dm-note-windows-portable
          path: apps/impl-dm-note/dist/portable/*.zip
          if-no-files-found: error

  windows-viewer:
    name: Windows in-game viewer
    needs: version
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build with MSVC
        shell: pwsh
        run: ./scripts/windows/build-game-webview.ps1 -Source (Resolve-Path native/game-webview) -Output (Join-Path $env:RUNNER_TEMP game-webview)

      # A release ships only a library that passed the probe.
      - name: Smoke probe
        shell: pwsh
        run: ./scripts/windows/smoke-game-webview.ps1 -Build (Join-Path $env:RUNNER_TEMP game-webview) -Shots (Join-Path $env:RUNNER_TEMP smoke-shots)

      - name: Upload the library
        uses: actions/upload-artifact@v4
        with:
          name: impl-game-webview-windows
          path: ${{ runner.temp }}/game-webview/ImplGameWebView.dll
          if-no-files-found: error

      - name: Upload smoke screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-viewer-smoke-shots
          path: ${{ runner.temp }}/smoke-shots
          if-no-files-found: ignore
