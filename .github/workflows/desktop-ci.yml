name: Desktop CI

# dev → pull request → main. Each push to main builds the ImplDmNote that
# `./scripts/run.sh release` packages into the mod (docs/releasing.md).
on:
  pull_request:
    paths:
      - "apps/impl-dm-note/**"
      - "package.json"
      - "package-lock.json"
      - "ImplResourcePack/Info.json"
      - "scripts/tasks/version/**"
      - ".github/workflows/desktop-ci.yml"
  push:
    branches: [main]
    paths:
      - "apps/impl-dm-note/**"
      - "package.json"
      - "package-lock.json"
      - "ImplResourcePack/Info.json"
      - "scripts/tasks/version/**"
      - ".github/workflows/desktop-ci.yml"
  # Builds main again when its artifacts expired or a run was cancelled.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version:
    name: Shared version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: The mod and ImplDmNote share one version
        run: node scripts/tasks/version/version.mjs check

  visual-regression:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Viewer compatibility baselines
        run: npm run test:visual -w @impl-resourcepack/impl-dm-note

  desktop:
    permissions:
      contents: read
      checks: write
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      LIBCLANG_PATH: C:\Program Files\LLVM\bin

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/impl-dm-note/src-tauri
          cache-on-failure: true

      - name: Install dependencies
        run: npm ci

      - name: Frontend gates
        run: |
          npm run sdk:check -w @impl-resourcepack/impl-dm-note
          npm run type-check -w @impl-resourcepack/impl-dm-note
          npm run lint -w @impl-resourcepack/impl-dm-note -- --max-warnings=0
          npm run format:check -w @impl-resourcepack/impl-dm-note
          npm run test -w @impl-resourcepack/impl-dm-note
          npm audit
          npm run desktop:audit

      - name: Rust gates
        working-directory: apps/impl-dm-note/src-tauri
        run: |
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings

      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: apps/impl-dm-note/src-tauri

      - name: Verify generated dependency licenses
        run: |
          cargo install cargo-about --version 0.9.2 --locked --features cli
          npm run licenses:generate -w @impl-resourcepack/impl-dm-note
          git diff --exit-code -- apps/impl-dm-note/THIRD_PARTY_LICENSES.txt

      - name: Clean macOS release build
        if: runner.os == 'macOS'
        run: |
          rm -rf apps/impl-dm-note/src-tauri/target
          npm run desktop:build:mac
          APP=apps/impl-dm-note/src-tauri/target/release/bundle/macos/ImplDmNote.app
          test -d "$APP/Contents/Resources/ImplDmNote.app"
          for file in LICENSE UPSTREAM.md THIRD_PARTY_NOTICES.txt THIRD_PARTY_LICENSES.txt; do
            test -f "$APP/Contents/Resources/$file"
          done
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Contents/Info.plist")" = "io.github.kgh1113.impldmnote"
          codesign --verify --deep --strict "$APP"
          # ditto keeps the signature and executable modes upload-artifact would drop.
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/ImplDmNote.app.zip"

      # `./scripts/run.sh release` packages this build into the macOS mod archive.
      - name: Upload macOS app
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: impl-dm-note-macos-app
          path: ${{ runner.temp }}/ImplDmNote.app.zip
          if-no-files-found: error

      - name: Build Windows portable ZIP
        if: runner.os == 'Windows'
        run: npm run desktop:build:windows

      - name: Verify Windows portable ZIP
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Get-Content apps/impl-dm-note/package.json | ConvertFrom-Json).version
          $name = "ImplDmNote-v$version-windows-x64-portable"
          $zip = "apps/impl-dm-note/dist/portable/$name.zip"
          if (-not (Test-Path $zip)) { throw "Missing $zip" }
          $unpack = Join-Path $env:RUNNER_TEMP "impl-dm-note-portable"
          Expand-Archive -Path $zip -DestinationPath $unpack -Force
          $root = Join-Path $unpack $name
          @(
            'impl-dm-note.exe',
            'LICENSE',
            'UPSTREAM.md',
            'THIRD_PARTY_NOTICES.txt',
            'THIRD_PARTY_LICENSES.txt'
          ) | ForEach-Object {
            if (-not (Test-Path (Join-Path $root $_))) { throw "Missing portable file: $_" }
          }
          if (Get-ChildItem $root -Recurse -File | Select-String -SimpleMatch 'com.dmnote.desktop','CN=esihunc') {
            throw 'Upstream package identity remains in the portable output.'
          }

      # `./scripts/run.sh release` packages this build into the Windows mod
      # archive; IMPL_RESOURCEPACK_DMNOTE_WINDOWS_ZIP uses it for a local package.
      - name: Upload Windows portable ZIP
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: impl-dm-note-windows-portable
          path: apps/impl-dm-note/dist/portable/*.zip
          if-no-files-found: error
